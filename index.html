/* ========== APP ========== */

function App(){
  const[as,setAs]=useState(0);
  const[st,setSt]=useState(0);
  const[sm,setSm]=useState(true);
  const[dir,setDir]=useState(0); /* 0 — первый рендер без анимации, 1 — вперёд, -1 — назад */
  const sc=scenarios[as],step=sc.steps[st];
  useEffect(()=>{setSt(0)},[as]);

  const goStep=n=>{if(n===st||n<0||n>sc.steps.length-1)return;setDir(n>st?1:-1);setSt(n)};
  const goScenario=i=>{if(i===as)return;setDir(i>as?1:-1);setAs(i);setSt(0)};

  /* Свайп: touchstart/touchend, порог 46px, горизонталь доминирует над вертикалью */
  const tRef=React.useRef(null);
  const onTS=e=>{const t=e.touches[0];tRef.current={x:t.clientX,y:t.clientY}};
  const onTE=e=>{
    if(!tRef.current)return;
    const t=e.changedTouches[0];
    const dx=t.clientX-tRef.current.x,dy=t.clientY-tRef.current.y;
    tRef.current=null;
    if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.15){dx<0?goStep(st+1):goStep(st-1)}
  };
  const onTC=()=>{tRef.current=null};

  const animKey=as+"-"+st;
  const dirClass=dir===1?"scr-fwd":dir===-1?"scr-back":"";
  const panClass=dir===1?"pan-fwd":dir===-1?"pan-back":"";

  return(
<div style={{minHeight:"100vh",background:BG,color:D}}>

{/* ============ HERO ============ */}
<header style={{background:D,color:BG,padding:"28px 40px 36px"}}>
  <div style={{maxWidth:1280,margin:"0 auto"}}>
    {/* top row */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:16,flexWrap:"wrap",marginBottom:40}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <BKMark size={30}/>
        <div style={{fontSize:13,fontWeight:600,letterSpacing:"-.01em"}}>Burger King <span style={{color:"rgba(245,235,220,.45)",fontWeight:400}}>× Альфа-Банк xPlatform</span></div>
      </div>
      <button onClick={()=>setSm(!sm)} style={{display:"flex",alignItems:"center",gap:8,background:"transparent",border:"1px solid rgba(245,235,220,.22)",padding:"8px 14px",borderRadius:999,fontSize:12,fontWeight:500,transition:"all .18s"}}
        onMouseEnter={e=>e.currentTarget.style.background="rgba(245,235,220,.07)"}
        onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
        <span style={{width:6,height:6,borderRadius:"50%",background:sm?O:"rgba(245,235,220,.3)"}}/>
        {sm?"Скрыть":"Показать"} метрики
      </button>
    </div>

    {/* title */}
    <div style={{display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,360px)",gap:48,alignItems:"end",marginBottom:36}}
         className="hero-grid">
      <div>
        <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:".18em",color:"rgba(245,235,220,.5)",marginBottom:14,fontWeight:500}}>Customer Journey Map</div>
        <h1 style={{fontSize:"clamp(40px, 6vw, 76px)",fontWeight:800,letterSpacing:"-.035em",lineHeight:.98,margin:0}}>
          Burger King <span style={{color:O}}>Pay</span>
        </h1>
      </div>
      <div style={{paddingBottom:14}}>
        <div style={{fontSize:15,color:"rgba(245,235,220,.75)",lineHeight:1.5,letterSpacing:"-.01em"}}>
          Интерактивный клиентский путь продукта Burger King Pay — white-label кошелька на платформе Альфа-Банка, встроенного в приложение Burger King. Прототип B2B-интеграции.
        </div>
      </div>
    </div>

    {/* segmented control */}
    <div>
      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:"rgba(245,235,220,.45)",marginBottom:10,fontWeight:500}}>Сценарий</div>
      <div style={{display:"inline-flex",background:"rgba(245,235,220,.06)",border:"1px solid rgba(245,235,220,.14)",borderRadius:16,padding:4,gap:2,flexWrap:"wrap",maxWidth:"100%"}}>
        {scenarios.map((s,i)=>(
          <button key={s.id} onClick={()=>goScenario(i)}
            style={{background:i===as?BG:"transparent",color:i===as?D:"rgba(245,235,220,.72)",padding:"10px 18px",borderRadius:12,fontSize:13,fontWeight:600,letterSpacing:"-.01em",transition:"all .18s",display:"flex",alignItems:"center",gap:8}}>
            <span style={{display:"inline-flex",width:18,height:18,alignItems:"center",justifyContent:"center",borderRadius:"50%",background:i===as?D:"rgba(245,235,220,.14)",color:i===as?BG:"rgba(245,235,220,.85)",fontSize:10,fontWeight:700}} className="num">{i+1}</span>
            {s.label}
          </button>))}
      </div>
      <div style={{fontSize:12,color:"rgba(245,235,220,.6)",marginTop:10,letterSpacing:"-.005em"}}>{sc.desc}</div>
    </div>
  </div>
</header>

{/* ============ MAIN ============ */}
<main style={{maxWidth:1280,margin:"0 auto",padding:"32px 40px 24px"}}>

  {/* progress rail */}
  <section style={{marginBottom:36}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:14}}>

      <div style={{position:"absolute",inset:0,width:`${(st/(sc.steps.length-1))*100}%`,background:R,transition:"width .2s"}}/>
    </div>
    {/* step labels */}
    <div style={{display:"grid",gridTemplateColumns:`repeat(${sc.steps.length}, minmax(0, 1fr))`,gap:4}} className="steps-row">
      {sc.steps.map((s,i)=>{
        const active=i===st, past=i<st;
        return(
          <button key={i} onClick={()=>goStep(i)}
            style={{textAlign:"left",padding:"10px 8px 0 0",borderTop:`2px solid ${active?R:past?D:G3}`,marginTop:-1,transition:"all .18s",background:"transparent"}}>
            <div style={{fontSize:11,fontWeight:600,color:active?R:past?D:G2,letterSpacing:".02em",marginBottom:4}} className="num">
              {String(i+1).padStart(2,"0")}
            </div>
            <div style={{fontSize:12,fontWeight:active?600:500,color:active?D:past?D:G1,lineHeight:1.25,letterSpacing:"-.01em"}}>
              {s.title}
            </div>
          </button>);
      })}
    </div>
  </section>

  {/* work area */}
  <section style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:56,alignItems:"start",touchAction:"pan-y"}} className="work-grid" onTouchStart={onTS} onTouchEnd={onTE} onTouchCancel={onTC}>
    {/* phone */}
    <div style={{display:"flex",justifyContent:"center"}}><Phone screenKey={step.screen} animKey={animKey} dirClass={dirClass}/></div>

    {/* info panel */}
    <div style={{minWidth:0,paddingTop:8,overflow:"hidden"}}>
      <div key={"p-"+animKey} className={panClass}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
        <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:G1,fontWeight:600}}>Шаг {st+1}</span>
        <span style={{width:3,height:3,borderRadius:"50%",background:G2}}/>
        <span style={{fontSize:11,color:D,fontWeight:500,padding:"3px 10px",border:"1px solid "+G3,borderRadius:999}}>{step.zone}</span>
      </div>

      <h2 style={{fontSize:"clamp(28px, 3.6vw, 44px)",fontWeight:700,letterSpacing:"-.03em",lineHeight:1.05,color:D,margin:"0 0 16px",textWrap:"balance"}}>
        {step.title}
      </h2>

      <p style={{fontSize:16,color:G1,lineHeight:1.55,margin:"0 0 28px",letterSpacing:"-.005em",maxWidth:580,textWrap:"pretty"}}>
        {step.desc}
      </p>

      {sm&&step.metricPartner&&(
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0,borderTop:"1px solid "+G3,borderBottom:"1px solid "+G3}} className="metrics-grid">
        <div style={{padding:"22px 24px 22px 0",borderRight:"1px solid "+G3}} className="metric-cell-l">
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <span style={{width:5,height:5,background:O,borderRadius:1}}/>
            <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:G1,fontWeight:600}}>Ценность для Burger King</span>
          </div>
          <div style={{fontSize:16,color:D,lineHeight:1.4,letterSpacing:"-.01em",fontWeight:500,textWrap:"pretty"}}>
            {step.metricPartner}
          </div>
        </div>
        <div style={{padding:"22px 0 22px 24px",position:"relative"}} className="metric-cell-r">
          <div style={{position:"absolute",left:24,top:22,bottom:22,width:2,background:R}}/>
          <div style={{paddingLeft:14}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <span style={{width:5,height:5,background:R,borderRadius:1}}/>
              <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:R,fontWeight:600}}>Ценность для Альфа-Банка</span>
            </div>
            <div style={{fontSize:16,color:D,lineHeight:1.4,letterSpacing:"-.01em",fontWeight:500,textWrap:"pretty"}}>
              {step.metricBank}
            </div>
          </div>
        </div>
      </div>)}

      </div>

      {/* nav */}
      <div style={{display:"flex",gap:8,marginTop:32}}>
        <button disabled={st===0} onClick={()=>goStep(st-1)}
          style={{display:"flex",alignItems:"center",gap:8,padding:"12px 20px",border:"1px solid "+G3,borderRadius:12,fontSize:13,fontWeight:600,color:st===0?G2:D,background:CARD,cursor:st===0?"default":"pointer",transition:"all .18s",opacity:st===0?.55:1}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 3L4.5 7l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Назад
        </button>
        <button disabled={st===sc.steps.length-1} onClick={()=>goStep(st+1)}
          style={{display:"flex",alignItems:"center",gap:8,padding:"12px 22px",border:"none",borderRadius:12,fontSize:13,fontWeight:700,color:st===sc.steps.length-1?G2:D,background:st===sc.steps.length-1?G3:Y,cursor:st===sc.steps.length-1?"default":"pointer",transition:"all .18s"}}>
          Далее
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 3l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  {/* ============ BENEFITS ============ */}
  {sm&&(
  <section style={{marginTop:96}}>
    <div style={{marginBottom:28}}>
      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:O,fontWeight:600,marginBottom:10}}>01 / Burger King</div>
      <h3 style={{fontSize:"clamp(26px, 3vw, 36px)",fontWeight:700,letterSpacing:"-.025em",lineHeight:1.1,color:D,margin:"0 0 8px"}}>Преимущества для Burger King</h3>
      <div style={{fontSize:14,color:G1,letterSpacing:"-.005em"}}>Что получает бизнес от интеграции Burger King Pay</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3, minmax(0, 1fr))",borderTop:"1px solid "+G3}} className="benefits-grid">
      {benefitsPartner.map((b,i)=>(
        <div key={i} style={{padding:"26px 24px 28px",borderBottom:"1px solid "+G3,borderRight:(i%3!==2)?"1px solid "+G3:"none"}} className="benefit-cell">
          <div style={{color:D,marginBottom:16,opacity:.85}}><Ico d={ICONS[b.icon]} size={24}/></div>
          <div style={{fontSize:16,fontWeight:600,color:D,marginBottom:6,letterSpacing:"-.015em",lineHeight:1.2}}>{b.title}</div>
          <div style={{fontSize:13,color:G1,lineHeight:1.5,letterSpacing:"-.005em"}}>{b.desc}</div>
        </div>))}
    </div>

    <div style={{marginTop:56,marginBottom:28}}>
      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".14em",color:R,fontWeight:600,marginBottom:10}}>02 / Альфа-Банк</div>
      <h3 style={{fontSize:"clamp(26px, 3vw, 36px)",fontWeight:700,letterSpacing:"-.025em",lineHeight:1.1,color:D,margin:"0 0 8px"}}>Ценность для Альфа-Банка</h3>
      <div style={{fontSize:14,color:G1,letterSpacing:"-.005em"}}>Стратегические эффекты от канала Burger King</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3, minmax(0, 1fr))",borderTop:"1px solid "+G3}} className="benefits-grid">
      {benefitsBank.map((b,i)=>(
        <div key={i} style={{padding:"26px 24px 28px",borderBottom:"1px solid "+G3,borderRight:(i%3!==2)?"1px solid "+G3:"none",position:"relative"}} className="benefit-cell">
          <div style={{color:R,marginBottom:16}}><Ico d={ICONS[b.icon]} size={24}/></div>
          <div style={{fontSize:16,fontWeight:600,color:D,marginBottom:6,letterSpacing:"-.015em",lineHeight:1.2}}>{b.title}</div>
          <div style={{fontSize:13,color:G1,lineHeight:1.5,letterSpacing:"-.005em"}}>{b.desc}</div>
        </div>))}
    </div>
  </section>)}

  {/* footer */}
  <footer style={{marginTop:80,paddingTop:24,borderTop:"1px solid "+G3,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <BKMark size={22}/>
      <span style={{fontSize:11,color:G1,fontWeight:500,letterSpacing:"-.005em"}}>Burger King Pay · Эмитент карты — АО «Альфа-Банк» · xPlatform · 2026</span>
    </div>
    <span style={{fontSize:11,color:G2,letterSpacing:".02em"}}>v2.1 · Burger King Edition</span>
  </footer>

</main>

{/* ============ RESPONSIVE ============ */}
<style>{`
@media (max-width: 1024px){
  .hero-grid{grid-template-columns: 1fr !important; gap: 20px !important; align-items: start !important;}
  .hero-grid > div:last-child{padding-bottom: 0 !important;}
}
@media (max-width: 900px){
  .work-grid{grid-template-columns: 1fr !important; gap: 36px !important;}
  .benefits-grid{grid-template-columns: repeat(2, minmax(0, 1fr)) !important;}
  .benefit-cell:nth-child(3n){border-right: 1px solid ${G3} !important;}
  .benefit-cell:nth-child(2n){border-right: none !important;}
}
@media (max-width: 720px){
  header{padding: 22px 20px 28px !important;}
  main{padding: 24px 20px 20px !important;}
  .steps-row{display: flex !important; overflow-x: auto; gap: 8px !important; padding-bottom: 6px;}
  .steps-row > button{flex: 0 0 130px;}
  .metrics-grid{grid-template-columns: 1fr !important;}
  .metric-cell-l{border-right: none !important; border-bottom: 1px solid ${G3} !important; padding: 20px 0 !important;}
  .metric-cell-r{padding: 20px 0 20px 14px !important;}
  .metric-cell-r > div:first-child{left: 0 !important;}
  .metric-cell-r > div:last-child{padding-left: 16px !important;}
  .benefits-grid{grid-template-columns: 1fr !important;}
  .benefit-cell{border-right: none !important;}
}
@media (max-width: 480px){
  h1{font-size: 44px !important;}
}
`}</style>

</div>);
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
